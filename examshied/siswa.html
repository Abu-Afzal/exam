<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>ExamShield — Siswa</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>🛡️</span> ExamShield
      <small id="siswaName">Siswa</small>
    </div>
    <nav class="sidebar-menu">
      <a href="#" data-section="dashboard" class="active">📊 Dashboard</a>
      <a href="#" data-section="token">🎯 Mulai Ujian</a>
      <a href="#" data-section="hasil">📈 Riwayat Nilai</a>
      <a href="#" id="logoutBtn">⬅ Keluar</a>
    </nav>
  </aside>

  <main class="content">
    <section id="sec-dashboard" class="section active">
      <h2>Selamat Datang</h2>
      <p>Silakan masukkan token ujian untuk mulai mengerjakan.</p>
    </section>

    <section id="sec-token" class="section hidden">
      <h2>🎯 Masukkan Token Ujian</h2>
      <form id="formToken" class="form-compact">
        <input type="text" id="inputToken" placeholder="Token Ujian" required />
        <button type="submit" class="btn-primary">✅ Mulai Ujian</button>
      </form>
    </section>

    <section id="sec-hasil" class="section hidden">
      <h2>Riwayat Nilai</h2>
      <table class="data-table" id="tabelNilai">
        <thead><tr><th>Ujian</th><th>Nilai</th><th>Tanggal</th><th>Detail</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/siswa.js"></script>
</body>
</html>
